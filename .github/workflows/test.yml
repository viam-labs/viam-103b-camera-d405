name: test

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # pyrealsense2 is only needed by the hardware model, and the runner has no
      # camera. Everything under test drives the simulated source.
      - run: pip install viam-sdk==0.80.0 numpy pillow pytest
      - run: python -m pytest -q
